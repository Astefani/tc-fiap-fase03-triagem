[project]
name = "tc-fiap-fase03-triagem"
version = "0.1.0"
description = "Classificação de textos médicos — Tech Challenge Fase 03 (Pós Tech ML Engineering, FIAP)"
authors = [{ name = "Alessandro Stefani", email = "stefani.alessandro@gmail.com" }]
requires-python = ">=3.12,<3.13"

dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "scikit-learn (>=1.9.1,<2.0.0)",
    "fastapi (>=0.143.2,<0.144.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "pydantic-settings (>=2.16.0,<3.0.0)",
    "prometheus-client (>=0.26.0,<0.27.0)",
    "onnxruntime (>=1.31.0,<2.0.0)",
    "skl2onnx (>=1.20.0,<2.0.0)",
    "tokenizers (>=0.23.3,<0.24.0)",
]

[tool.poetry]
packages = [{ include = "triagem", from = "src" }]

# Ferramentas de desenvolvimento
[tool.poetry.group.dev.dependencies]
ipykernel = "^7.4.0"
pytest = "^9.1.1"
ruff = "^0.17.1"
httpx = "^0.28.1"
matplotlib = "^3.11.2"
seaborn = "^0.13.2"
dvc = {extras = ["s3"], version = "^3.67.1"}

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# Treino do BERT: opcional (poetry install --with train)
[tool.poetry.group.train]
optional = true

# Uso de CUDA 12.8 no Linux (RTX 5070) e PyPI no Mac
[tool.poetry.group.train.dependencies]
torch = [
    { version = "2.7.1+cu128", source = "pytorch-cu128", markers = "sys_platform == 'linux'" },
    { version = "2.7.1", markers = "sys_platform == 'darwin'" },
]
transformers = "^5.20"
accelerate = "^1.15"

[[tool.poetry.source]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
priority = "explicit"

# Rastreamento no MLflow do DagsHub (D-7): opcional (poetry install --with rastreamento)
[tool.poetry.group.rastreamento]
optional = true

[tool.poetry.group.rastreamento.dependencies]
mlflow-skinny = "^3.0"
